name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact main SHA to publish; must match the workflow revision
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match explicitly requested revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REQUESTED_REVISION" && "$REQUESTED_REVISION" != "$GITHUB_SHA" ]]; then
            echo 'Requested SHA no longer matches main. Review current main before retrying.' >&2
            exit 1
          fi
      - name: Read already-enabled Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Require the configured custom domain
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test "$PAGES_HOST" = floraria.fasl-work.com
          test -z "$PAGES_BASE_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate exact source and canonical artifacts
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/check_content_standards.py
          python scripts/check_template_residue.py
          python scripts/check_release.py --git-modes
          python scripts/check_artifacts.py
          python data-pipeline/run.py verify --offline
          python -m unittest discover -s tests -v
      - name: Build and prepare public static files
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test
          npm --prefix frontend run build
          python scripts/check_release.py --built
          python scripts/prepare_pages.py --require-clean --revision "$GITHUB_SHA"
          git diff --exit-code
      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
          retention-days: 7
      - name: Preserve release identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-identity-${{ github.sha }}
          path: |
            build/pages/release.json
            build/pages-build-receipt.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
