name: Quality
on:
  push:
    branches: [main, develop, 'task/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Content, source boundaries and canonical artifacts
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/check_content_standards.py
          python scripts/check_template_residue.py
          python scripts/check_release.py --git-modes
          python scripts/check_artifacts.py
          python data-pipeline/run.py verify --offline
      - name: Processing and delivery tests in isolated sandboxes
        run: python -m unittest discover -s tests -v
      - name: Frontend tests and production build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test
          npm --prefix frontend run build
          python scripts/check_release.py --built
          git diff --exit-code -- data manifests
      - name: Save reviewable static artifact
        if: matrix.node == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: floraria-static-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
