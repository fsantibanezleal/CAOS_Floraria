<text x="607" y="121" text-anchor="start" class="ttl l-es">Contrato didáctico</text>
<text x="607" y="140" class="cd l-neutral">Catalog.structures</text>
<text x="607" y="161" text-anchor="start" class="it l-en">Component IDs + model membership</text>
<text x="607" y="161" text-anchor="start" class="it l-es">Identificadores + modelo</text>
<text x="607" y="177" text-anchor="start" class="it l-en">Original explanatory text</text>
<text x="607" y="177" text-anchor="start" class="it l-es">Explicación original</text>
<text x="607" y="193" text-anchor="start" class="it l-en">Illustrative proportions / colors</text>
<text x="607" y="193" text-anchor="start" class="it l-es">Proporciones / colores ilustrativos</text>
