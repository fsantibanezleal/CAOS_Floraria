<text x="35" y="87" text-anchor="start" class="band-label l-en">SOURCED RELATIONSHIPS</text>
<text x="35" y="87" text-anchor="start" class="band-label l-es">RELACIONES CON FUENTES</text>
<rect x="20" y="268" width="840" height="160" rx="10" class="band"/>
<text x="35" y="290" text-anchor="start" class="band-label l-en">AUTHORED SPATIAL REPRESENTATIONS</text>
<text x="35" y="290" text-anchor="start" class="band-label l-es">REPRESENTACIONES ESPACIALES PROPIAS</text>
