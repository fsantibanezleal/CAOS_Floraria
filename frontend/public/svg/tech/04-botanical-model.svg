<text x="327" y="364" text-anchor="start" class="it l-es">Labelo y columna identificados</text>
<text x="327" y="380" text-anchor="start" class="it l-en">No generic free-stamen ring</text>
<text x="327" y="380" text-anchor="start" class="it l-es">Sin anillo genérico de estambres</text>
<text x="327" y="396" text-anchor="start" class="it l-en">Not scan segmentation</text>
<text x="327" y="396" text-anchor="start" class="it l-es">No es segmentación del escaneo</text>
<rect x="595" y="303" width="250" height="103" rx="7" class="bx bx-eng"/>
<text x="607" y="324" text-anchor="start" class="ttl l-en">Explanatory transforms</text>
<text x="607" y="324" text-anchor="start" class="ttl l-es">Transformaciones explicativas</text>
<text x="607" y="343" class="cd l-neutral">Viewer.tsx</text>
