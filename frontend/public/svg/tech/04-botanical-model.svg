<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0L7 3.5L0 7Z"/></marker></defs>
<rect width="880" height="620" class="bg"/>
<text x="25" y="27" text-anchor="start" class="heading l-en">The botanical explanation is explicit</text>
<text x="25" y="27" text-anchor="start" class="heading l-es">La explicación botánica es explícita</text>
<text x="25" y="49" text-anchor="start" class="subtitle l-en">A hierarchy defines what can be selected. A source defines what can be claimed.</text>
<text x="25" y="49" text-anchor="start" class="subtitle l-es">La jerarquía define qué se puede seleccionar. La fuente define qué se puede afirmar.</text>
