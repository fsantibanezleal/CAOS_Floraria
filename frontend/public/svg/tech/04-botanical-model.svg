<text x="252" y="446" text-anchor="middle" class="lbl l-en">preserve organ identity</text>
<text x="252" y="446" text-anchor="middle" class="lbl l-es">conservar identidad del órgano</text>
<path d="M440 406V509" class="flow"/>
<text x="475" y="461" text-anchor="middle" class="lbl l-en">explain</text>
