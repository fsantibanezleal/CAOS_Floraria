<text x="47" y="364" text-anchor="start" class="it l-es">Separar e inspeccionar partes</text>
<text x="47" y="380" text-anchor="start" class="it l-en">Restore original arrangement</text>
<text x="47" y="380" text-anchor="start" class="it l-es">Restaurar organización inicial</text>
<text x="47" y="396" text-anchor="start" class="it l-en">Not a measured species model</text>
<text x="47" y="396" text-anchor="start" class="it l-es">No es un modelo de especie medido</text>
<rect x="315" y="303" width="250" height="103" rx="7" class="bx bx-web"/>
<text x="327" y="324" text-anchor="start" class="ttl l-en">Orchid teaching model</text>
<text x="327" y="324" text-anchor="start" class="ttl l-es">Modelo didáctico de orquídea</text>
<text x="327" y="343" class="cd l-neutral">botany.ts · orchid</text>
