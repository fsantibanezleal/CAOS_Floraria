<text x="607" y="364" text-anchor="start" class="it l-es">Traslación / corte / visibilidad</text>
<text x="607" y="380" text-anchor="start" class="it l-en">Reversible view operations</text>
<text x="607" y="380" text-anchor="start" class="it l-es">Operaciones visuales reversibles</text>
<text x="607" y="396" text-anchor="start" class="it l-en">Not dissection measurements</text>
<text x="607" y="396" text-anchor="start" class="it l-es">No son mediciones de disección</text>
<rect x="105" y="509" width="670" height="68" rx="7" class="bx bx-hi"/>
<text x="117" y="530" text-anchor="start" class="ttl l-en">Pollen transfer → later fertilization → seed / fruit identities</text>
<text x="117" y="530" text-anchor="start" class="ttl l-es">Transferencia de polen → fecundación posterior → semilla / fruto</text>
<text x="117" y="549" class="cd l-neutral">stage ∈ [0, 1] · explanatory progress, not biological time</text>
