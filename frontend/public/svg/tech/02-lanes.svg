<text x="327" y="500" text-anchor="start" class="ttl l-es">Manipular la vista</text>
<text x="327" y="519" class="cd l-neutral">Viewer.tsx · botany.ts</text>
<text x="327" y="540" text-anchor="start" class="it l-en">No biological prediction engine</text>
<text x="327" y="540" text-anchor="start" class="it l-es">Sin motor de predicción biológica</text>
<text x="327" y="556" text-anchor="start" class="it l-en">Paused explanatory sequence</text>
<text x="327" y="556" text-anchor="start" class="it l-es">Secuencia explicativa pausada</text>
<rect x="595" y="479" width="250" height="101" rx="7" class="bx bx-hi"/>
<text x="607" y="500" text-anchor="start" class="ttl l-en">Keep a meaningful state</text>
<text x="607" y="500" text-anchor="start" class="ttl l-es">Conservar un estado útil</text>
<text x="607" y="519" class="cd l-neutral">lib/state.ts</text>
