<text x="607" y="139" class="cd l-neutral">export · verify</text>
<text x="607" y="160" text-anchor="start" class="it l-en">Catalog IDs and references</text>
<text x="607" y="160" text-anchor="start" class="it l-es">Identificadores y referencias</text>
<text x="607" y="176" text-anchor="start" class="it l-en">Artifact hashes / manifest</text>
<text x="607" y="176" text-anchor="start" class="it l-es">Huellas / manifiesto de recursos</text>
<text x="607" y="192" text-anchor="start" class="it l-en">Sandbox checks stay separate</text>
<text x="607" y="192" text-anchor="start" class="it l-es">Pruebas en entorno separado</text>
<rect x="155" y="319" width="570" height="61" rx="7" class="bx bx-store"/>
<text x="167" y="340" text-anchor="start" class="ttl l-en">Immutable catalog, geometry and client bundle</text>
<text x="167" y="340" text-anchor="start" class="ttl l-es">Catálogo, geometría y cliente inmutables</text>
<text x="167" y="359" class="cd l-neutral">data/artifacts/ → frontend/dist/ → static HTTPS</text>
