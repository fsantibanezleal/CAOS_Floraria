<text x="47" y="500" text-anchor="start" class="ttl l-es">Decodificar cuando se necesita</text>
<text x="47" y="519" class="cd l-neutral">GLTFLoader · DRACOLoader</text>
<text x="47" y="540" text-anchor="start" class="it l-en">Local decoder resources</text>
<text x="47" y="540" text-anchor="start" class="it l-es">Decodificadores locales</text>
<text x="47" y="556" text-anchor="start" class="it l-en">Bounded fidelity selection</text>
<text x="47" y="556" text-anchor="start" class="it l-es">Selección de fidelidad delimitada</text>
<rect x="315" y="479" width="250" height="101" rx="7" class="bx bx-web"/>
