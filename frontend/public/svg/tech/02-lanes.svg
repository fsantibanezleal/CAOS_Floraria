<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 620" class="arch-svg" role="img">
<title>What runs where</title>
<style>
svg .l-es { display:none; }
.bg { fill:var(--color-surface, Canvas); } .band { fill:var(--color-surface-2, Canvas); stroke:var(--color-border, GrayText); }
.bx { fill:var(--color-surface, Canvas); stroke:var(--color-border, GrayText); stroke-width:1.4; }
.bx-hi { stroke:var(--color-accent, rebeccapurple); } .bx-eng { stroke:var(--color-warn, darkgoldenrod); } .bx-store,.bx-web { stroke:var(--color-good, seagreen); } .bx-warn { stroke:var(--color-warn, darkgoldenrod); }
text { font-family:system-ui,sans-serif; fill:var(--color-fg, CanvasText); } .heading {font-size:20px;font-weight:650;} .subtitle {font-size:12px;fill:var(--color-fg-subtle, GrayText);} .band-label {font-size:10px;font-weight:650;letter-spacing:1px;fill:var(--color-fg-subtle, GrayText);} .ttl {font-size:12px;font-weight:650;} .cd {font-size:9.2px;font-family:ui-monospace,monospace;fill:var(--color-accent, rebeccapurple);} .it {font-size:10.3px;fill:var(--color-fg-subtle, GrayText);} .flow {fill:none;stroke:var(--color-accent, rebeccapurple);stroke-width:1.4;marker-end:url(#arr);} .lbl {font-size:9px;fill:var(--color-fg-subtle, GrayText);paint-order:stroke;stroke:var(--color-surface, Canvas);stroke-width:5;stroke-linejoin:round;} .arrow {fill:var(--color-accent, rebeccapurple);}
</style>
<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path class="arrow" d="M0 0L7 3.5L0 7Z"/></marker></defs>
<rect width="880" height="620" class="bg"/>
<text x="25" y="27" text-anchor="start" class="heading l-en">What runs where</text>
<text x="25" y="27" text-anchor="start" class="heading l-es">Dónde se ejecuta cada parte</text>
<text x="25" y="49" text-anchor="start" class="subtitle l-en">Acquisition is offline. Interaction is local. Delivery serves a fixed bundle.</text>
<text x="25" y="49" text-anchor="start" class="subtitle l-es">La adquisición es previa. La interacción es local. Se sirve un paquete fijo.</text>
<rect x="20" y="64" width="840" height="179" rx="10" class="band"/>
<text x="35" y="86" text-anchor="start" class="band-label l-en">OFFLINE · REPRODUCIBLE SOURCE PROCESSING</text>
<text x="35" y="86" text-anchor="start" class="band-label l-es">PREVIO · PROCESAMIENTO REPRODUCIBLE</text>
<rect x="20" y="284" width="840" height="115" rx="10" class="band"/>
<text x="35" y="306" text-anchor="start" class="band-label l-en">STATIC RELEASE BRIDGE</text>
<text x="35" y="306" text-anchor="start" class="band-label l-es">PUENTE DE PUBLICACIÓN ESTÁTICA</text>
<rect x="20" y="444" width="840" height="154" rx="10" class="band"/>
<text x="35" y="466" text-anchor="start" class="band-label l-en">BROWSER · NO ACCOUNT OR RUNTIME SECRET</text>
<text x="35" y="466" text-anchor="start" class="band-label l-es">NAVEGADOR · SIN CUENTA NI SECRETO EN EJECUCIÓN</text>
<rect x="35" y="99" width="250" height="122" rx="7" class="bx bx-store"/>
<text x="47" y="120" text-anchor="start" class="ttl l-en">Acquire locked files</text>
<text x="47" y="120" text-anchor="start" class="ttl l-es">Adquirir archivos fijados</text>
<text x="47" y="139" class="cd l-neutral">data-pipeline/run.py</text>
<text x="47" y="160" text-anchor="start" class="it l-en">Official source URL + SHA-256</text>
<text x="47" y="160" text-anchor="start" class="it l-es">URL oficial + SHA-256</text>
<text x="47" y="176" text-anchor="start" class="it l-en">Cache verified before reuse</text>
<text x="47" y="176" text-anchor="start" class="it l-es">Caché verificada antes de reutilizar</text>
<text x="47" y="192" text-anchor="start" class="it l-en">Reject unexpected bytes</text>
<text x="47" y="192" text-anchor="start" class="it l-es">Rechazar bytes inesperados</text>
