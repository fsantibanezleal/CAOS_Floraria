<text x="327" y="139" class="cd l-neutral">inspect · normalize</text>
<text x="327" y="160" text-anchor="start" class="it l-en">Geometry / materials / bounds</text>
<text x="327" y="160" text-anchor="start" class="it l-es">Geometría / materiales / límites</text>
<text x="327" y="176" text-anchor="start" class="it l-en">Compact / detailed variants</text>
<text x="327" y="176" text-anchor="start" class="it l-es">Variantes compacta / detallada</text>
<text x="327" y="192" text-anchor="start" class="it l-en">Preserve source relationship</text>
<text x="327" y="192" text-anchor="start" class="it l-es">Conservar relación de origen</text>
<rect x="595" y="99" width="250" height="122" rx="7" class="bx bx-hi"/>
